name: Build, verify, and publish development releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-rush/toolchain
          key: godot-linux-${{ hashFiles('tools/toolchain.lock') }}
      - run: python tools/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-check-evidence
          path: reports/checks.json
          if-no-files-found: error

  network:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [race-reconnect, race-expiry, contacts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-rush/toolchain
          key: godot-linux-${{ hashFiles('tools/toolchain.lock') }}
      - run: python tools/godot.py --headless --editor --import --quit
      - name: Faulted race and five-second reconnect
        if: matrix.scenario == 'race-reconnect'
        run: python tools/network_integration.py --seconds 90 --latency 75 --jitter 30 --loss .03 --reconnect
      - name: Expired 25-second disconnect remains DNF without duplicate identity
        if: matrix.scenario == 'race-expiry'
        run: python tools/network_integration.py --seconds 90 --latency 75 --jitter 30 --loss .03 --reconnect --away-seconds 25
      - name: Repeated side/rear contacts under real UDP faults
        if: matrix.scenario == 'contacts'
        run: python tools/network_integration.py --seconds 340 --latency 75 --jitter 30 --loss .03 --contacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-evidence-${{ matrix.scenario }}
          path: reports/network-*/
          if-no-files-found: error

  platform-adapter:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
          - platform: windows
            runner: windows-2022
          - platform: macos
            runner: macos-15
          - platform: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-rush/native
          key: platform-sdk-${{ runner.os }}-${{ matrix.platform }}-${{ hashFiles('tools/toolchain.lock') }}
      - name: Linux Secret Service build and isolated test dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android native toolchain
        if: matrix.platform == 'android'
        run: sdkmanager 'ndk;28.1.13356709'
      - run: python tools/native_build.py ${{ matrix.platform }}
      - name: Exercise the real OS store with temporary test data
        if: matrix.platform != 'android'
        run: python tools/native_store_ci.py --isolated
      - uses: actions/upload-artifact@v4
        with:
          name: platform-adapter-${{ matrix.platform }}
          path: |
            native/bin/*.so
            native/bin/*.dll
            native/bin/*.dylib
            native/bin/manifest-*.json
          if-no-files-found: error

  export:
    needs: [verify, platform-adapter]
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows, macos, android, android_aab, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-rush/toolchain
          key: godot-exports-linux-${{ hashFiles('tools/toolchain.lock') }}
      - uses: actions/setup-java@v4
        if: startsWith(matrix.target, 'android')
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: startsWith(matrix.target, 'android')
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android packages and stable development identity
        if: startsWith(matrix.target, 'android')
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.1' 'ndk;28.1.13356709'
          mkdir -p ~/.android
          if [ -n "$KEYSTORE" ]; then
            umask 077
            printf '%s' "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo 'Missing stable development Android signing identity.' >&2
            exit 1
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Pacific Rush PR' -keyalg RSA -keysize 2048 -validity 30
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-adapter-*
          merge-multiple: true
          path: native/bin
      - run: python tools/build.py ${{ matrix.target }} --number ${{ github.run_number }}
      - name: Verify Android package
        if: matrix.target == 'android'
        run: $ANDROID_HOME/build-tools/35.0.1/apksigner verify --verbose build/android/pacific-rush.apk
      - name: Verify Android App Bundle signature
        if: matrix.target == 'android_aab'
        run: jarsigner -verify build/android_aab/pacific-rush.aab
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: build/download/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [export, network, native, lobbies, directory]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.0.${{ github.run_number }}-dev" release/* --target "$GITHUB_SHA" --title "Development Build ${{ github.run_number }}" --notes-file docs/RELEASE.md --prerelease

  native:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          - target: server
            runner: ubuntu-24.04
          - target: windows
            runner: windows-2022
          - target: macos
            runner: macos-15
          - target: macos
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: build/download
      - name: Run exported native package
        shell: bash
        run: python tools/native_package_smoke.py ${{ matrix.target }} build/download/*-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.target }}-${{ matrix.runner }}
          path: reports/native-*.json
          if-no-files-found: error

  lobbies:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-rush/toolchain
          key: godot-linux-${{ hashFiles('tools/toolchain.lock') }}
      - run: python tools/godot.py --headless --editor --import --quit
      - name: Eight clients, all cars, two tracks and persistent rematch
        run: python tools/lobby_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lobby-eight-client-evidence
          path: reports/lobby-eight-*/
          if-no-files-found: error

  directory:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache-dependency-path: services/directory/go.sum
      - run: go -C services/directory test -race ./...
      - run: go -C services/directory vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pacific-rush/toolchain
          key: godot-linux-${{ hashFiles('tools/toolchain.lock') }}
      - run: python tools/godot.py --headless --editor --import --quit
      - name: Cross-language ticket signature and claim rejection
        run: |
          mkdir -p reports
          go -C services/directory run ./cmd/ticket-fixture
          python tools/godot.py --headless --script tests/ticket_tests.gd
      - name: Caddy HTTPS, auth, forwarding and private-interface boundaries
        run: python tools/caddy_integration.py
      - name: Game HTTPS client, HMAC sessions, allocation and private codes
        run: python tools/directory_client_integration.py
      - name: Real allocated worker, eight signed admissions and two races
        run: python tools/directory_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-evidence
          path: |
            reports/directory-eight-*/summary.json
            reports/directory-eight-*/*.log
            reports/caddy-*/summary.json
            reports/caddy-*/*.log
            reports/directory-client-*/summary.json
            reports/directory-client-*/*.log
          if-no-files-found: warn
