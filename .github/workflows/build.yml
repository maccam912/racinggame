name: Build and publish development releases

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/packages.yml
    secrets: inherit

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: server-container
          path: container-release
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.0.${{ github.run_number }}-dev
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [ -z "$remote_tag" ]; then
            git fetch --no-tags origin main
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows/; then
              echo "::notice::A newer workflow superseded this run. Packages remain available as artifacts; release tagging requires the newer run or an explicitly pre-created tag."
              exit 0
            fi
            git push origin "$GITHUB_SHA:refs/tags/$RELEASE_TAG"
            remote_tag=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          fi
          tag_commit=$(printf '%s' "$remote_tag" | cut -f1)
          test "$tag_commit" = "$GITHUB_SHA"
          cd container-release
          sha256sum --check image.sha256
          docker load --input image.tar.gz
          cd ..
          server_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pacific-rush-server"
          docker tag "pacific-rush-ci:${{ github.run_number }}" "$server_image:$RELEASE_TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$server_image:$RELEASE_TAG"
          image_digest=$(docker image inspect "$server_image:$RELEASE_TAG" --format '{{index .RepoDigests 0}}')
          cp docs/RELEASE.md /tmp/pacific-release-notes.md
          # Markdown backticks are literal text in this format string.
          # shellcheck disable=SC2016
          printf '\nServer OCI image: `%s`.\n' "$image_digest" >> /tmp/pacific-release-notes.md
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Development Build ${{ github.run_number }}" --notes-file /tmp/pacific-release-notes.md --prerelease
