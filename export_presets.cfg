[preset.0]
name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
export_filter="all_resources"
include_filter="*.json,*.csv,*.md,LICENSE"
exclude_filter="reports/*,tools/*,tests/*,docs/*,services/*,assets/source/*"
export_path="build/linux/pacific-rush.x86_64"
[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=false
dedicated_server=false
export_filter="all_resources"
include_filter="*.json,*.csv,*.md,LICENSE"
exclude_filter="reports/*,tools/*,tests/*,docs/*,services/*,assets/source/*"
export_path="build/windows/pacific-rush.exe"
[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false

[preset.2]
name="macOS"
platform="macOS"
runnable=false
dedicated_server=false
export_filter="all_resources"
include_filter="*.json,*.csv,*.md,LICENSE"
exclude_filter="reports/*,tools/*,tests/*,docs/*,services/*,assets/source/*"
export_path="build/macos/pacific-rush.zip"
[preset.2.options]
binary_format/architecture="universal"
application/bundle_identifier="dev.pacificrush.game"
application/short_version="0.0.1"
application/version="1"
codesign/codesign=1
codesign/identity="-"
notarization/notarization=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.3]
name="Android"
platform="Android"
runnable=false
dedicated_server=false
export_filter="all_resources"
include_filter="*.json,*.csv,*.md,LICENSE"
exclude_filter="reports/*,tools/*,tests/*,docs/*,services/*,assets/source/*"
export_path="build/android/pacific-rush.apk"
[preset.3.options]
gradle_build/use_gradle_build=false
gradle_build/min_sdk="29"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
package/unique_name="dev.pacificrush.game"
package/name="Pacific Rush"
package/signed=true
version/code=1
version/name="0.0.1-dev"
screen/immersive_mode=true
permissions/internet=true
permissions/access_network_state=true
permissions/vibrate=true
user_data_backup/allow=false
textures/vram_compression/import_etc2_astc=true

[preset.4]
name="Server"
platform="Linux"
runnable=false
dedicated_server=true
custom_features="dedicated_server"
export_filter="all_resources"
include_filter="*.json"
exclude_filter="reports/*,tools/*,tests/*,docs/*,services/*,assets/*,game/ui/*,game/audio/*"
export_path="build/server/pacific-rush-server.x86_64"
[preset.4.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true

